[project]
name = "phishing-url-ml"
version = "0.1.0"
description = "Phishing URL and email detection with one-hot encoding + feature scaling"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "joblib>=1.3",
]

[project.optional-dependencies]
# Fetches the Kaggle email corpus; not needed to train on a local CSV.
data = ["kagglehub>=0.3"]
dev = [
    "pytest>=7.0",
    "kagglehub>=0.3",
    "tomli>=2.0; python_version < '3.11'",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
